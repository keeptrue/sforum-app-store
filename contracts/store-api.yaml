openapi: 3.1.0
info:
  title: SForum Store API
  version: 0.1.0
  description: |
    商城服务端的唯一跨产物契约。公开目录只读；签名下载与插件安装交接都走这里。
    所有时间使用 RFC 3339；所有摘要为 64 位小写十六进制 SHA-256。
servers:
  - url: /api
    description: Same-origin service routes
tags:
  - name: ops
  - name: catalog
  - name: distribution
paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: 运行状态
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/catalog:
    get:
      tags: [catalog]
      operationId: listCatalog
      summary: 目录
      description: |
        只返回已发布产品。`sforum` 是宿主 `coreVersion`（严格 semver），用于对每个
        `release_version.sforum_version_constraint` 做 Masterminds 约束求值；缺失或非法时
        `compatibility=unknown`，不过滤。`sforumBuild` 只用于识别 dev 构建（并据此决定
        `compat` 的默认值），不参与约束求值。响应里的 `compat` 回显本次实际生效的口径。
      parameters:
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: sforum
          in: query
          description: 宿主 CoreCompatibilityVersion；严格 semver。
          schema:
            type: string
        - name: sforumBuild
          in: query
          description: 宿主 version.Get().Version；可能是 dev / dev-abc12。
          schema:
            type: string
        - name: os
          in: query
          schema:
            type: string
            examples: [linux]
        - name: arch
          in: query
          schema:
            type: string
            examples: [amd64]
        - name: platform
          in: query
          description: |
            架构维度的列表口径。

            - `strict`（默认，省略即此值）：列表只保留「至少有一个候选版本支持
              `os`/`arch`」的产品。
            - `all`：放宽架构维度，当前平台跑不了的产品也照样出现，由客户端自己画
              「不支持当前架构」徽标。管理员关掉「只看支持当前架构」时才用这个口径。

            `all` **只放宽可见性**：`compatibility` 仍然按 `os`/`arch` 求值，所以一个
            只在别的平台上发布的产品在这个口径下依旧报 `incompatible`——它出现在列表里
            不等于商城改判成可安装。`compatibility` 的版本维度判定也不变：`compat=compatible`
            下仍按宿主 coreVersion 筛，只是不再因为架构不符把产品整条藏掉。

            `os`/`arch` 仍须照常传：`compatibility` 判定要用它们。旧客户端不发这个参数，
            因此默认 `strict` 与既有行为完全一致。
          schema:
            type: string
            enum: [strict, all]
            default: strict
        - name: compat
          in: query
          description: |
            已知宿主版本时的过滤强度。省略时按宿主构建决定：dev 构建（`sforumBuild` 以
            `dev` 开头）为 `all`，其余为 `compatible`。dev 宿主的版本只是近似值，按它过滤
            会产生假阴性，所以默认不过滤；显式传值始终优先。
          schema:
            type: string
            enum: [compatible, all]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            type: string
        - name: kind
          in: query
          description: 按扩展类型筛选；缺失表示不筛。
          schema:
            type: string
            enum: [plugin, theme]
        - name: extensionIds
          in: query
          description: |
            按扩展 ID 批量过滤，逗号分隔，最多 200 个（按去重后的数量算）。用于客户端
            一次问清「我装过的这些扩展里哪些有更新」：响应只包含命中集合内的产品，
            未知 ID 直接忽略，不影响其余结果。

            空项与重复项由服务端去掉；省略、或全部为空表示不过滤。任一 ID 不符合
            `^[a-z0-9][a-z0-9._-]{0,159}$`、或去重后超过 200 个时返回 400
            `invalid_query`——拼错的 ID 会悄悄变成「没有更新」，所以宁可报错。
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 18
      responses:
        "200":
          description: Page of products.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/products/{slug}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: 产品详情
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: sforum
          in: query
          schema:
            type: string
        - name: sforumBuild
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Product detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{slug}/releases:
    get:
      tags: [catalog]
      operationId: listProductReleases
      summary: 版本历史
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: Releases ordered by semver descending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseVersion"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{slug}/releases/{version}:
    get:
      tags: [catalog]
      operationId: getProductRelease
      summary: 单个版本
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseVersion"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/mode:
    get:
      tags: [distribution]
      operationId: getAuthMode
      summary: 下载签发是否要求登录
      description: |
        匿名。插件在显示「连接商城」之前先问这一条；旧商城没有这个路由（404）时按
        `anonymous` 处理，安装照旧匿名。响应 `no-store`。
      responses:
        "200":
          description: The gate in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMode"
  /v1/auth/requests:
    post:
      tags: [distribution]
      operationId: createAuthRequest
      summary: 发起一次「连接商城」授权请求
      description: |
        匿名（调用方还没有凭据，凭据正是这条流程的产物）。`code_challenge` 是 S256
        PKCE challenge；verifier 只留在插件后端。返回的 `authorize_url` 用生效的对外地址
        拼成，插件必须校验它的 origin 与自身配置的商城地址一致后再导航。

        没有可用 issuer 时返回 503 `issuer_unavailable`：授权页无从登录，不如直接说清楚。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallAuthRequestCreate"
      responses:
        "200":
          description: The request id and where to send the operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallAuthRequestCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: 商城没有可用的论坛 issuer（后台未配置或已停用）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/requests/{id}:
    get:
      tags: [distribution]
      operationId: getAuthRequestStatus
      summary: 轮询授权状态
      description: |
        只返回 `status`，不泄露账号、标签或时间。插件按响应里的 `interval` 轮询；
        `approved` 之后立即兑换，不要重复轮询。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallAuthRequestStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/requests/{id}/token:
    post:
      tags: [distribution]
      operationId: exchangeAuthRequest
      summary: 用 verifier 兑换账号令牌（一次性）
      description: |
        校验 PKCE 之后在事务里消费请求，所以同一个请求只能兑换一次：重放返回 409
        `request_already_used`。verifier 不匹配返回 400 `pkce_mismatch`，且**不消耗**请求，
        调用方可以改正后重试。

        响应里是唯一一次出现的明文令牌。调用方必须立刻写入宿主的加密 secret 设置，
        不得落日志、不得进审计。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallAuthTokenExchange"
      responses:
        "200":
          description: The account token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallAuthToken"
        "400":
          description: |
            `invalid_request`（body 形状）、`invalid_verifier`（长度/字符集）、
            `pkce_mismatch`（challenge 对不上，请求仍可用）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            请求存在但不可兑换：`request_denied` / `request_not_approved` /
            `request_already_used`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: 请求已过期（`request_expired`）。回论坛重新发起。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/me:
    get:
      tags: [distribution]
      operationId: getAuthAccount
      summary: 当前令牌对应的账号
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Who this token belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallAuthMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/revoke:
    post:
      tags: [distribution]
      operationId: revokeAuthToken
      summary: 断开连接（撤销当前令牌）
      description: |
        幂等：已过期、已撤销、不存在的令牌同样返回 204。插件「断开连接」先调这里（尽力），
        再清宿主里的 secret。
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked (or already unusable).
  /v1/download-urls:
    post:
      tags: [distribution]
      operationId: createDownloadUrl
      summary: 签发下载链接（插件用）
      description: |
        匿名单据与公开产品页同一权限面；已发布即可安装。签名 token 绑定 asset id、sha256 与
        exp，TTL 30 分钟，可重复取用；不承诺单次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadUrlRequest"
      responses:
        "200":
          description: Signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            产品不可见、版本不存在或该平台没有资产。稳定错误码：
            `product_not_found` / `release_not_found` / `no_stable_release` /
            `asset_not_found`。yank 与断开不在这里拦——签发成功但下载时复核失败返回 410。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/products/{slug}/download/{os}/{arch}:
    get:
      tags: [distribution]
      operationId: redirectToDownload
      summary: 浏览器下载入口（302）
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: os
          in: path
          required: true
          schema:
            type: string
        - name: arch
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: |
            有会话（或 `download_auth_mode=anonymous`）时 302 到签名下载地址；
            `account_required` 且没有商城会话时 302 到
            `/api/auth/sforum/start?redirect=<本路径>`，登录回调 303 回本路径。
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/download/{token}:
    get:
      tags: [distribution]
      operationId: downloadAsset
      summary: 签名下载
      description: |
        复核资产存在、未 yank、摘要一致、版本/产品 published、上游非 disconnected；不要求
        「当前最新版本」。失败返回 410 与稳定错误码。

        两种形态，同一条 URL：
        - `200`：商城自己转发字节（`STORE_DOWNLOAD_MODE=proxy`，也是默认值，以及所有私有仓库）。
        - `302`：`STORE_DOWNLOAD_MODE=redirect` 且仓库公开时，把 GitHub 已签好的对象地址交给
          客户端，商城不再承担带宽。复核仍在签发这一跳生效；已发出的 302 目标无法事后撤销。
          调用方必须能跟随跨域 302（宿主 `install-from-url` 的该行为未验证）。
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP stream (proxy mode, or a private repository in redirect mode).
          headers:
            Content-Type:
              schema:
                type: string
                const: application/zip
            Content-Length:
              schema:
                type: integer
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to the signed object URL (public repository, redirect mode).
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        "410":
          description: Token expired, release yanked, or upstream disconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        商城账号令牌（`sfo_…`，30 天，scope `download:issue`）。由插件后端在
        `/connect/{id}` 授权后经 `POST /v1/auth/requests/{id}/token` 一次性兑换取得，
        之后只存在于宿主加密的 secret 设置里。令牌是**论坛级**：同一论坛的所有管理员共用，
        审计记「哪个商城账号授权了这台论坛」，不记「哪个管理员点了安装」。
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
  responses:
    Unauthorized:
      description: |
        缺少或不可用的账号令牌。稳定错误码：`login_required`（没有令牌/结构不合法）、
        `token_expired`、`token_revoked`、`account_disabled`、`insufficient_scope`。
        插件按这五个码决定「去连接」还是「重新连接」。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid query or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found. Authorization failures are also 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version, commit, time]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        commit:
          type: string
        time:
          type: string
          format: date-time
        publicUrl:
          type: string
          description: |
            The base URL this process is actually using. Every redirect, OAuth callback,
            download short link and same-origin check is derived from it, so a deployment
            behind a proxy or tunnel can compare it with the address bar and see a mismatch
            immediately. `publicUrlSource` says which layer answered: the row saved under
            系统设置 (`database`) or the `STORE_PUBLIC_URL` seed (`env`).
        publicUrlSource:
          type: string
          enum: [database, env]
        settingsUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the runtime settings row was last written; null when none exists.
        configWarning:
          type: string
          description: |
            Non-fatal: a stored setting was ignored and fell back to its seed, or the settings
            row could not be read because the database is unreachable.
        sessionCookie:
          type: string
          description: Name of the forum-session cookie, `__Host-store_session` when secure.
        cookieSecure:
          type: boolean
          description: Whether cookies are issued with `Secure` and the `__Host-` prefix.
        nodeEnv:
          type: string
        downloadAuthMode:
          type: string
          enum: [anonymous, account_required]
          description: |
            下载签发是否要求商城账号。`anonymous` 是默认：已发布即可安装。切到
            `account_required` 之后，未升级的旧插件会在 `/v1/download-urls` 收到 401。
        downloadAuthModeSource:
          type: string
          enum: [database, env]
        configError:
          type: string
          description: |
            Present when the process is listening but its configuration is unreadable. Health
            stays a liveness probe: the process answering at all is still useful evidence.
    Channel:
      type: string
      enum: [stable, beta]
    CompatibilityStatus:
      type: string
      enum: [compatible, incompatible, unknown]
    Compatibility:
      type: object
      required: [status, estimated]
      properties:
        status:
          $ref: "#/components/schemas/CompatibilityStatus"
        estimated:
          type: boolean
          description: |
            dev 构建（`sforumBuild` 以 `dev` 开头）为 true。此时宿主版本号来自最近的 git tag，
            判定仅供参考，最终以安装时 core 的结论为准。
        constraint:
          type: string
          description: 命中的 sforumVersion 约束（unknown 时省略）。
    Platform:
      type: object
      required: [os, arch]
      properties:
        os:
          type: string
        arch:
          type: string
    Author:
      type: object
      description: |
        产品的维护者身份，两个来源都来自事实，不做拼接猜测：
        - 论坛账号：开发者用 SForum OAuth2 登录商城后绑定的账号（`accounts` 行）。
        - GitHub 仓库账号：绑定仓库的所属账号（installation 的 `account.login`）。

        两者都可能缺：产品可以只绑仓库没绑论坛账号，也可能换了仓库。缺一项就不发那一项，
        不会用另一项填空。GitHub 账号说的是「仓库在谁名下」，组织仓库时并不等于开发者本人，
        所以展示文案必须写「仓库账号」而不是「作者本人」。`null` 表示两项都没有。
      properties:
        username:
          type: [string, "null"]
          description: 论坛账号用户名（`accounts.username`），登录名，不是显示名。
        displayName:
          type: [string, "null"]
          description: 论坛账号显示名（`accounts.display_name`）；未设置时为 null。
        avatarUrl:
          type: [string, "null"]
          format: uri
          description: 论坛账号头像绝对地址；不可用时为 null，客户端退回字母块。
        profileUrl:
          type: [string, "null"]
          format: uri
          description: |
            论坛个人主页的绝对地址（`<issuer base_url>/u/<username>`）。论坛的前台路由由
            论坛自己拥有，商城只按登录时登记的 issuer 基址拼出来；缺用户名或缺 issuer 配置时
            为 null，客户端把用户名渲染成纯文本而不是死链。
        github:
          type: [object, "null"]
          description: 绑定仓库的所属 GitHub 账号；产品未绑定仓库时为 null。
          properties:
            login:
              type: string
              description: GitHub 账号登录名（`github_installations.account_login`）。
            url:
              type: string
              format: uri
              description: 该账号的 GitHub 主页地址。
    ProductSummary:
      type: object
      required:
        - slug
        - extensionId
        - name
        - kind
        - summary
        - latestVersion
        - sforumVersion
        - updatedAt
        - platforms
        - latestPlatforms
        - compatibility
        - author
      properties:
        slug:
          type: string
        extensionId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [plugin, theme]
        summary:
          type: string
        category:
          type: [string, "null"]
          description: 商城自己的目录分类键（见 service/src/lib/products/taxonomy.ts）。
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: [string, "null"]
          description: |
            内容寻址的产品图标地址。图标优先取自绑定仓库的 `brand/icon.png`（方形 PNG，
            ≤1 MiB —— 宿主品牌契约里的同一个文件），缺失或不可用时回退到 GitHub 社交预览，
            两者都没有才是 null（客户端画字母占位）。开发者不能上传，仓库是唯一来源。
        socialImageUrl:
          type: [string, "null"]
          description: |
            内容寻址的品牌分享卡地址（包内 `brand/social-preview.png`，1280×640）。目录卡片把
            它当作封面背景，产品页用它做链接预览；没有分享卡时为 null，卡片退回分类色板。
            与图标同源：仓库是唯一来源，开发者不能上传。
        latestVersion:
          type: string
        sforumVersion:
          type: string
          description: |
            最新可安装版本在清单里声明的 sforumVersion：Masterminds 约束，原样透出，
            不是版本号，也不代表商城对它做过判定。清单值不可解析时为空串。
            目录卡片展示它，是因为这是产品事实；兼容性判决仍由 core 在安装时做。
        updatedAt:
          type: string
          format: date-time
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        latestPlatforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
          description: |
            卡片指向的那一版（`latestVersion`）的发布资产覆盖的平台。

            与 `platforms` 的差别是语义而不是取值：`platforms` 是全部候选版本的并集，
            回答「至少某一版能不能装」；`latestPlatforms` 只回答「最新这一版能不能装」。
            两者不一致正是「最新版不支持当前架构，但旧版可以」这一状态的唯一信息来源，
            客户端据此选徽标文案并决定弹窗默认选哪一版。

            空数组表示这一版没有任何发布资产：那是「不知道」，不是「不支持」——客户端对
            空数组不得判为不可安装。`platform=strict` 口径下列表里出现的产品必然至少有一个
            候选版本支持宿主平台，但这不保证是 `latestPlatforms` 那一版。
        compatibility:
          $ref: "#/components/schemas/Compatibility"
        author:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
          description: |
            维护者身份。字段结构见 `Author`；两项来源都缺失时为 `null`（客户端不画作者块）。
            取代了 v0.1 的 `owner` 字符串：那个字段把 username 与 displayName 混成一个值，
            也没有 GitHub 侧，客户端无法区分「展示名」与「账号」。
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [readme, releases]
          properties:
            readme:
              oneOf:
                - $ref: "#/components/schemas/ProductReadme"
                - type: "null"
              description: |
                绑定仓库的 README 渲染结果。产品介绍只有这一个来源：摘要之外的文案由
                开发者手写，正文由仓库提供。尚未成功读取时为 null。
            repoUrl:
              type: [string, "null"]
              format: uri
              description: 仓库网页地址；产品尚未绑定仓库时为 null。永不返回 API/资产地址。
            releases:
              type: array
              items:
                $ref: "#/components/schemas/ReleaseVersion"
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/Permission"
              description: 权限目录在 S4/S5 定稿；S3 省略该字段，改用 releases[].capabilities。
    ProductReadme:
      type: object
      required: [html, sourceUrl, fetchedAt]
      properties:
        html:
          type: string
          description: |
            服务端渲染并消毒后的 HTML（白名单标签与属性、外链 nofollow、图片 https-only）。
            这是唯一对外表示：不发布 markdown 源，也不接受客户端渲染。
        sourceUrl:
          type: string
          format: uri
          description: README 在 GitHub 上的页面地址（`/blob/<ref>/<path>`）。永不含 API 或资产地址。
        sha:
          type: [string, "null"]
          description: GitHub blob 摘要；README 内容变化时随之变化，用于审计。
        fetchedAt:
          type: string
          format: date-time
          description: 本次内容从 GitHub 取回的时间。
        byteSize:
          type: integer
          minimum: 0
          description: README 源文件字节数。
    ReleaseVersion:
      type: object
      required:
        - version
        - channel
        - publishedAt
        - sforumVersion
        - status
        - assets
      properties:
        version:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        publishedAt:
          type: string
          format: date-time
        sforumVersion:
          type: string
          description: Masterminds 约束，不是版本号。
        digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            单平台版本的摘要；多平台版本省略，以 assets[].sha256 为准（一个版本可挂多个平台包）。
        status:
          type: string
          enum: [published, yanked, needs_attention]
        notesUrl:
          type: string
          description: 当前没有独立 changelog 页面，保留字段位；内容见 notes。
        notes:
          type: [string, "null"]
          description: |
            GitHub Release 正文原文（Markdown 源文本，未渲染）。保留原样是给需要自己渲染的
            客户端（以及审计）用的；要直接展示请用 `notesHtml`。这个字段不含 HTML，
            也不会被消毒器改写 —— 渲染由 `notesHtml` 承担。
        notesHtml:
          type: [string, "null"]
          description: |
            `notes` 渲染并消毒后的 HTML，与 README 同一条链路（markdown-it + highlight.js +
            sanitize-html 白名单）。给管理页直接注入用：一个渲染器、一份白名单，两个面
            口径一致。`notes` 为 null 时本字段同样为 null；旧商城不发送本字段。
            标题不带 `id` 与永久链接（同一个弹窗里有多条 release，锚点会跨版本撞 id）。
        capabilities:
          type: array
          items:
            type: string
          description: 清单声明的能力键（manifest capabilities），原样透出，不带风险等级判定。
        manifest:
          type: object
          description: |
            清单里宿主会展示的元数据（description / url / author / langs），原样透出。
            产品名仍取自清单 name，产品介绍仍只来自 README；这里不是第二份产品文案。
            旧版本行没有该字段。
          properties:
            description:
              type: string
            url:
              type: string
              format: uri
            author:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
            langs:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/ManifestLocale"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseAsset"
    ReleaseAsset:
      type: object
      required: [os, arch, filename, size, sha256]
      properties:
        os:
          type: string
        arch:
          type: string
        filename:
          type: string
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    ManifestLocale:
      type: object
      description: 清单 langs 里的一段本地化覆盖；字段均为可选，未声明即回退顶层默认值。
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        author:
          type: object
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
    Permission:
      type: object
      required: [key, risk]
      properties:
        key:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        description:
          type: string
    CatalogPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type: [string, "null"]
        compatibility:
          $ref: "#/components/schemas/Compatibility"
        compat:
          type: string
          enum: [compatible, all]
          description: |
            本次实际生效的兼容过滤口径：显式传入的值，或按宿主构建推出的默认值。可选——
            旧服务端不返回该字段，旧客户端忽略它。
    AuthMode:
      type: object
      required: [mode, token_ttl_seconds]
      properties:
        mode:
          type: string
          enum: [anonymous, account_required]
        token_ttl_seconds:
          type: integer
          description: 新令牌的有效期（30 天），供插件显示「何时需要重新连接」。
    InstallAuthRequestCreate:
      type: object
      required: [code_challenge]
      properties:
        code_challenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: S256 PKCE challenge（base64url 无填充）。verifier 不出插件后端。
        client_label:
          type: string
          maxLength: 64
          description: 插件上报的展示名，不可信，授权页按纯文本渲染。
    InstallAuthRequestCreated:
      type: object
      required: [id, authorize_url, expires_in, interval]
      properties:
        id:
          type: string
          format: uuid
        authorize_url:
          type: string
          format: uri
          description: 用生效的对外地址拼成；插件必须校验 origin 后导航。
        expires_in:
          type: integer
          description: 授权请求的有效期（300 秒）。
        interval:
          type: integer
          description: 建议轮询间隔（2 秒）。
    InstallAuthRequestStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, consumed, expired]
    InstallAuthTokenExchange:
      type: object
      required: [code_verifier]
      properties:
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
    InstallAccount:
      type: object
      required: [id, issuerKey, username, displayName, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        issuerKey:
          type: string
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    InstallAuthToken:
      type: object
      required: [access_token, token_type, expires_in, expires_at, scope, account]
      properties:
        access_token:
          type: string
          description: |
            `sfo_` + 43 字符。只在本响应里出现一次；调用方必须写入宿主加密 secret，
            不得落日志或审计。
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time
        scope:
          type: string
          const: download:issue
        account:
          $ref: "#/components/schemas/InstallAccount"
    InstallAuthMe:
      type: object
      required: [account, expires_at, scope]
      properties:
        account:
          $ref: "#/components/schemas/InstallAccount"
        expires_at:
          type: string
          format: date-time
        scope:
          type: string
    DownloadUrlRequest:
      type: object
      required: [product, os, arch]
      description: |
        `download_auth_mode=account_required` 时本请求必须带 `Authorization: Bearer <token>`；
        `anonymous` 时令牌可有可无（带了就校验并审计，无效令牌忽略）。签发是账号级，
        但签发出来的签名 URL 仍是 30 分钟的 bearer。
      properties:
        product:
          type: string
          description: Product slug.
        version:
          type: string
          description: 省略时取最新 stable。
        os:
          type: string
        arch:
          type: string
    DownloadUrlResponse:
      type: object
      required: [url, sha256, size, expiresAt]
      properties:
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [version_conflict]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
