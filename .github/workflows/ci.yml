name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://store:store@127.0.0.1:5432/store
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Contract drift
        run: |
          bun run contract:generate
          git diff --exit-code -- service/src/lib/api-types.ts

      - name: Capability catalog drift
        run: bun run capabilities:check

      - name: Test (unit + Postgres integration)
        working-directory: service
        run: bun test

      # Bun runtime gate: if native deps fail here, the allowed fallback is
      # `next start` under Node; builds and scripts stay on Bun. Evidence wins.
      - name: Build (Bun runtime gate)
        working-directory: service
        run: bun --bun next build

      - name: Smoke
        working-directory: service
        run: |
          bun --bun next start -p 4000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo "service did not become healthy" >&2
          exit 1

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin SDK is not published as a Go module; pin the SForum commit that
      # landed the host-mediated install action and build against it. Pinned by
      # full 40-char SHA to the v3.0.17 commit: a short SHA is not a valid fetch
      # refspec, and a tag can be force-moved, which would silently build a
      # different core.
      - name: Checkout SForum (SDK)
        uses: actions/checkout@v4
        with:
          repository: zhuchunshu/SForum
          path: SForum
          ref: 5a4ce5eaf341ba0825fdb6ffca87e63be88d3250 # v3.0.17

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/plugins/sforum.store/backend/go.mod
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Repo-root/SForum is one level shallower than the local sibling layout, so the
      # checked-in replace path is overridden here instead of being committed twice.
      - name: Point the SDK at the SForum checkout
        working-directory: plugin/plugins/sforum.store/backend
        run: go mod edit -replace github.com/zhuchunshu/sforum/apps/api=../../../../SForum/apps/api

      - name: Test plugin backend
        working-directory: plugin/plugins/sforum.store/backend
        run: |
          go vet ./...
          go test ./...

      - name: Admin page tests
        run: bun test plugin/plugins/sforum.store/frontend/admin/src

      - name: Build package, validate manifest, assert digests are reproducible
        working-directory: plugin/plugins/sforum.store
        run: |
          bash ../../scripts/build.sh
          git diff --exit-code sforum.extension.json
          test -s backend/plugin
          test -s frontend/admin/dist/catalog.mjs
