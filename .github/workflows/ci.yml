name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://store:store@127.0.0.1:5432/store
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test (dev tooling)
        run: bun test scripts/

      - name: Contract drift
        run: |
          bun run contract:generate
          git diff --exit-code -- service/src/lib/api-types.ts

      - name: Capability catalog drift
        run: bun run capabilities:check

      - name: Test (unit + Postgres integration)
        working-directory: service
        run: bun test

      # Bun runtime gate: if native deps fail here, the allowed fallback is
      # `next start` under Node; builds and scripts stay on Bun. Evidence wins.
      - name: Build (Bun runtime gate)
        working-directory: service
        run: bun --bun next build

      - name: Smoke
        working-directory: service
        run: |
          bun --bun next start -p 4000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo "service did not become healthy" >&2
          exit 1

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin SDK is not published as a Go module; pin the SForum commit we build
      # against. Always a full 40-char SHA: a short SHA is not a valid fetch refspec, and
      # a tag can be force-moved, which would silently build a different core.
      #
      # This pin is the v3.0.19 release commit: it carries `SecretService.Put/Clear`, which
      # the store plugin's "connect store" flow writes the account token through. The
      # manifest's `sforumVersion` (`>=3.0.19`) and this ref must move together — a plugin
      # built against an older core compiles (the RPC is additive) but the write fails at
      # runtime with `host_api_unsupported`-class errors, and a manifest that demands 3.0.19
      # on an older core is refused at install time.
      #
      # Module path note: `apps/api/go.mod` declares `github.com/keeptrue/sforum/apps/api`
      # (renamed from zhuchunshu in e753c72b0); tags before that rename still declare the
      # old path and cannot resolve this `replace`.
      - name: Checkout SForum (SDK)
        uses: actions/checkout@v4
        with:
          repository: keeptrue/SForum
          path: SForum
          ref: 600fa68e6bcd15f97a5bbaea98b4dfd46f71ae33 # v3.0.19：带 SecretService.Put/Clear

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/plugins/sforum.store/backend/go.mod
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Repo-root/SForum is one level shallower than the local sibling layout, so the
      # checked-in replace path is overridden here instead of being committed twice.
      - name: Point the SDK at the SForum checkout
        working-directory: plugin/plugins/sforum.store/backend
        run: go mod edit -replace github.com/keeptrue/sforum/apps/api=../../../../SForum/apps/api

      - name: Test plugin backend
        working-directory: plugin/plugins/sforum.store/backend
        run: |
          go vet ./...
          go test ./...

      - name: Admin page tests
        run: bun test plugin/plugins/sforum.store/frontend/admin/src

      - name: Build package, validate manifest, assert digests are reproducible
        working-directory: plugin/plugins/sforum.store
        run: |
          bash ../../scripts/build.sh
          git diff --exit-code sforum.extension.json
          test -s backend/plugin
          test -s frontend/admin/dist/catalog.mjs
